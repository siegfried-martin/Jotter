# Add inside the existing `server { ... }` block for jotter.marstol.com, ABOVE the SPA's
# catch-all `location / { try_files ... /index.html; }`. The SPA keeps serving everything
# else, including /oauth/consent (a client-side route).

# The MCP endpoint (Streamable HTTP). Responses may stream, so don't buffer them.
location = /mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# OAuth protected-resource metadata (RFC 9728): how Claude discovers Supabase Auth.
location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
